{% extends 'donations/base.html' %}

{% block title %}Login - DonationMS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-indigo-50 rounded-lg flex items-center justify-center mx-auto mb-4 border border-indigo-100">
                <i data-lucide="lock" class="text-indigo-600 w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">System Login</h1>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Authentication Required</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div class="space-y-1">
                <label for="{{ field.id_for_label }}" class="block text-[10px] font-bold text-slate-500 uppercase tracking-widest">{{ field.label }}</label>
                {{ field.errors }}
                <input type="{% if 'password' in field.name %}password{% else %}text{% endif %}" 
                       name="{{ field.name }}" 
                       id="{{ field.id_for_label }}"
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded text-xs focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-medium"
                       {% if field.field.required %}required{% endif %}>
            </div>
            {% endfor %}

            <button type="submit" class="w-full py-2.5 bg-slate-900 text-white text-[10px] font-bold rounded uppercase tracking-widest hover:bg-slate-800 transition-all shadow-sm">
                Commit Credentials
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">No Node Identity?</p>
            <a href="{% url 'register' %}" class="text-indigo-600 text-xs font-bold hover:underline mt-1 block">Register New User</a>
        </div>
    </div>
</div>
{% endblock %}
